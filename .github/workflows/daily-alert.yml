name: Weather Notify

on:
  schedule:
    # 6:00 AM IST (Asia/Kolkata) = 00:00 UTC
    - cron: "0 0 * * *"

  workflow_dispatch:

env:
  TZ: "Asia/Kolkata"

jobs:
  weather-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Wake up server
        run: |
          echo "Waking Weather Notify server..."

          curl --fail --retry 5 --retry-delay 3 --retry-all-errors --max-time 120 \
            https://weather-notify-tau.vercel.app/api/health

      - name: Wait for server
        run: |
          echo "Waiting 5 seconds for server to be fully ready..."
          sleep 5

      - name: Send weather alerts
        run: |
          echo "Sending weather alerts..."

          curl --fail --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://weather-notify-tau.vercel.app/api/cron/weather-alert

      - name: Completed
        run: |
          echo "Weather alert workflow completed successfully."
