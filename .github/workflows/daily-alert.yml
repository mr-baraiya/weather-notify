name: Daily Weather Alert

on:
  schedule:
    - cron: '7 6 * * *'
      timezone: 'Asia/Kolkata'
  workflow_dispatch:

jobs:
  send-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger weather alert
        run: |
          curl -f \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://weather-notify-tau.vercel.app/api/send-alert
