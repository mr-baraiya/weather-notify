name: Weather Notify

on:
  schedule:
    # 5:55 AM IST - Wake server
    - cron: "25 0 * * *"

    # 6:00 AM IST - Send weather alerts
    - cron: "30 0 * * *"

  workflow_dispatch:

jobs:
  wake-server:
    # Run at 5:55 AM OR when manually triggered
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '25 0 * * *'

    runs-on: ubuntu-latest

    steps:
      - name: Wake up server
        run: |
          echo "Waking Weather Notify server..."

          curl --fail --max-time 120 \
            https://weather-notify-tau.vercel.app/api/health

      - name: Confirm server is awake
        run: |
          echo "Waiting 60 seconds for server to fully wake..."
          sleep 60

          curl --fail --max-time 120 \
            https://weather-notify-tau.vercel.app/api/health


  send-alerts:
    # Run at 6:00 AM OR when manually triggered
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '30 0 * * *'

    runs-on: ubuntu-latest

    steps:
      - name: Send weather alerts
        run: |
          echo "Sending weather alerts..."

          curl --fail --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://weather-notify-tau.vercel.app/api/cron/weather-alert
